[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
name = "nomad-uibk-plugin"
description = "UIBK schema and parser collection for NOMAD plattform."
dynamic = ["version"]
readme = "README.rst"
requires-python = ">=3.10"
authors = [
    { name = "Fabian Schöppach", email = "fabian.schoeppach@physik.hu-berlin.de" },
    { name = "Lev Ginzburg", email = "lev.ginzburg@physik.hu-berlin.de" },
]
maintainers = [
    { name = "Lev Ginzburg", email = "lev.ginzburg@physik.hu-berlin.de" },
]
license = { file = "LICENSE" }
dependencies = [
    "nomad-lab[infrastructure]==1.4.3",
    "nomad-measurements>=1.3.0",
    "nomad-material-processing>=0.0.10",
    "nomad-pvcomb @ git+https://codebase.helmholtz.cloud/pvcomb/nomad-pvcomb.git@main",
    "pandas",
    "plotly",
    "pillow",
    "opentelemetry-semantic-conventions==0.63b1",    # temp bugfix - explicit dependency from nomad-lab not picked up
    "opentelemetry-instrumentation==0.63b1",    # temp bugfix - explicit dependency from nomad-lab not picked up
    "opentelemetry-instrumentation-asgi==0.63b1",    # temp bugfix - explicit dependency from nomad-lab not picked up
    "opentelemetry-instrumentation-elasticsearch==0.63b1",    # temp bugfix - explicit dependency from nomad-lab not picked up
    "opentelemetry-instrumentation-pymongo==0.63b1",    # temp bugfix - explicit dependency from nomad-lab not picked up
]

[project.urls]
Repository = "https://github.com/Thin-Layers-Technology-Innsbruck/nomad-UIBK-plugin"

[tool.uv]
prerelease = "explicit"  # Allows pre-release/dev versions
index-url = "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple"

[project.optional-dependencies]
analytics = [
    "ifm-imagesegmentation @ git+https://github.com/csav1974/IFM-ImageSegmentation.git@main",
    "scikit-image",
    "imageio",
]
dev = [
    "nomad-uibk-plugin[analytics]",
    "ruff",
    "pytest",
    "structlog",
]
cpu-action = ["nomad-uibk-plugin[analytics]"]

[tool.setuptools_scm]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # isort
    "I",
    # pylint
    "PL",
]

ignore = [
    "F403", # 'from module import *' used; unable to detect undefined names
    "PLC0415", # import not at the top
    "PLR0917", # too many positional arguments
]

fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# this is entirely optional, you can remove this if you wish to
[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"

# indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.cruft]
# Avoid updating workflow files, this leads to permissions issues
skip = [".github/*"]

[project.entry-points.'nomad.plugin']
# schema
sample = "nomad_uibk_plugin.schema_packages:sample"
xrfschema = "nomad_uibk_plugin.schema_packages:xrfschema"
ifmschema = "nomad_uibk_plugin.schema_packages:ifmschema"
effschema = "nomad_uibk_plugin.schema_packages:effschema"
# parser
xrfparser = "nomad_uibk_plugin.parsers:xrfparser"
ifmparser = "nomad_uibk_plugin.parsers:ifmparser"
ifmmodelparser = "nomad_uibk_plugin.parsers:ifmmodelparser"
jvjsonparser = "nomad_uibk_plugin.parsers:jvjsonparser"
# action
ifm_inference = "nomad_uibk_plugin.actions:ifm_inference"
# app
ifmanalysisapp = "nomad_uibk_plugin.apps:ifmanalysisapp_ep"
uibksamplesapp = "nomad_uibk_plugin.apps:uibksamplesapp_ep"
